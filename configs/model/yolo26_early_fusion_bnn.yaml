# Binarized YOLO26 early fusion (RGB+IR, 4-channel). Same detector as
# `yolo26_early_fusion`, with convs swapped per region — see
# docs/binarization_plan.md and src/binarized_cv/models/binarized/policy.py.
name: yolo26_early_fusion
num_classes: 1
img_size: [640, 640]
scale: n
pretrained: false
# fp32 checkpoint of this same model (e.g. runs/checkpoints/yolo26_early_fusion/<ts>/epoch_N.pt)
# to warm-start from — strongly recommended for BNN training.
init_checkpoint: null
binarization:
  preset: ib_guided  # fp32 | ib_guided | full
  # Per-region override of the preset: fp | binary | <bits>. null = preset value.
  regions:
    input_conv: null
    stem: null
    p3: null
    backbone_deep: null
    neck_deep: null
    attention: null
    head_one2one: null
    head_out: null
    head_one2many: null
  stochastic: false
  skip_depthwise: true
  depthwise_fallback_bits: 8
  # Deployment-faithful quantization, opt-in until retrained checkpoints
  # replace the current ones (CHECKLIST.md section 10):
  # same = stride-2 binary convs pad like TF/LCE "SAME" (bottom/right only).
  binary_padding: symmetric  # symmetric | same
  integer_zero_point: false  # k-bit inputs: integer zero point, range incl. 0
  quantize_output: false  # k-bit convs: fake-quantize the output too
